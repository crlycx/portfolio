<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly C</title>
    <!-- Tailwind CSS for sleek dark theme & responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #e2e8f0;
            text-align: center;
        }

            button {
  /* Variables */
  --button_radius: 0.75em;
  --button_color: #e8e8e8;
  --button_outline_color: #000000;
  font-size: 17px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  border-radius: var(--button_radius);
  background: var(--button_outline_color);
}

.button_top {
  display: block;
  box-sizing: border-box;
  border: 2px solid var(--button_outline_color);
  border-radius: var(--button_radius);
  padding: 0.75em 1.5em;
  background: var(--button_color);
  color: var(--button_outline_color);
  transform: translateY(-0.2em);
  transition: transform 0.1s ease;
}

button:hover .button_top {
  /* Pull the button upwards when hovered */
  transform: translateY(-0.33em);
}

button:active .button_top {
  /* Push the button downwards when pressed */
  transform: translateY(0);
}

        /*
        }
        .btn {
            display: inline-block;
            background-color: #2b2d42;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #404360;
        }
        */

        /* Responsive styling for the TryHackMe badge container & embedded content */
        .thm-badge-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Ensure injected iframe, img, svg, or canvas from TryHackMe script scale smoothly on mobile */
        .thm-badge-wrapper > *,
        .thm-badge-wrapper iframe,
        .thm-badge-wrapper img,
        .thm-badge-wrapper svg {
            max-width: 100% !important;
            height: auto !important;
            box-sizing: border-box !important;
        }

        @media (max-width: 480px) {
            .thm-badge-wrapper {
                padding: 4px;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">

    <!-- Main Container -->
    <main class="max-w-xl w-full mx-auto my-auto space-y-6">

        <!-- About Section -->
        <section class="bg-slate-900/90 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl backdrop-blur-sm">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">Carly Cox</h1>
            <p class="text-slate-400 mt-2 mb-6 text-sm sm:text-base">ISC2 CC certified entry level cybersecurity analyst in Austin, TX</p>

            <button>
              <span class="button_top"> <a href="#contact" class="btn">Send a Message</a> </span>
            </button>
            
            <!-- Live TryHackMe Badge Container -->
            <div class="thm-badge-wrapper bg-slate-950/50 rounded-xl border border-slate-800/80 p-2 sm:p-4">
                <script src="https://tryhackme.com/badge/t/e276ea2f98412ac06e86eb13195ba991f1c881f6ddb02d6a4505592bc9eed61935a7f332c2979a0b7fbd09163b78840b?theme=dark"></script>
            </div>
        </section>


    </main>

    <!-- Footer Section -->
    <footer id="contact" class="text-center pt-8 pb-4 text-xs sm:text-sm text-slate-500 border-t border-slate-800/80 max-w-xl mx-auto w-full mt-8">
        <p><span class="font-medium text-slate-400">hello@carly.world</span></p>
    </footer>

</body>
</html>
