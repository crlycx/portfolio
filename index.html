<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cybersecurity Portfolio</title>
    <!-- Tailwind CSS for sleek dark theme & responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #e2e8f0;
        }

        /* Responsive styling for the TryHackMe badge container & embedded content */
        .thm-badge-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Ensure injected iframe, img, svg, or canvas from TryHackMe script scale smoothly on mobile */
        .thm-badge-wrapper > *,
        .thm-badge-wrapper iframe,
        .thm-badge-wrapper img,
        .thm-badge-wrapper svg {
            max-width: 100% !important;
            height: auto !important;
            box-sizing: border-box !important;
        }

        @media (max-width: 480px) {
            .thm-badge-wrapper {
                padding: 4px;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">

    <!-- Main Container -->
    <main class="max-w-xl w-full mx-auto my-auto space-y-6">

        <!-- About Section -->
        <section class="bg-slate-900/90 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl backdrop-blur-sm">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">Welcome to My Portfolio</h1>
            <p class="text-slate-400 mt-2 mb-6 text-sm sm:text-base">Cybersecurity learner and developer.</p>
            
            <!-- Live TryHackMe Badge Container -->
            <div class="thm-badge-wrapper bg-slate-950/50 rounded-xl border border-slate-800/80 p-2 sm:p-4">
                <script src="https://tryhackme.com/badge/t/e276ea2f98412ac06e86eb13195ba991f1c881f6ddb02d6a4505592bc9eed61935a7f332c2979a0b7fbd09163b78840b?theme=dark"></script>
            </div>
        </section>

        <!-- Quick Follow-Up Section -->
        <section class="bg-slate-900/90 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl backdrop-blur-sm">
            <h2 class="text-xl font-bold text-slate-100 mb-4">Quick Follow-Up</h2>
            
            <form action="mailto:your-email@example.com" method="POST" enctype="text/plain" class="space-y-4">
                <div>
                    <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Name</label>
                    <input type="text" id="name" name="Name" required placeholder="Your Name"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-slate-100 placeholder-slate-600 text-sm transition-all">
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
                    <input type="email" id="email" name="Email" required placeholder="Your Email"
                           class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-slate-100 placeholder-slate-600 text-sm transition-all">
                </div>

                <button type="submit" 
                        class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 px-6 rounded-xl transition-all duration-200 text-sm shadow-md hover:shadow-cyan-500/20 active:scale-[0.99] cursor-pointer">
                    Send via Email
                </button>
            </form>
        </section>

    </main>

    <!-- Footer Section -->
    <footer class="text-center pt-8 pb-4 text-xs sm:text-sm text-slate-500 border-t border-slate-800/80 max-w-xl mx-auto w-full mt-8">
        <p>Contact: <span class="font-medium text-slate-400">your-email@example.com</span></p>
    </footer>

</body>
</html>
